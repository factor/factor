name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build-linux-intel:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: bootstrap
      run: ./build.sh net-bootstrap
    - name: load-all
      run: './factor -e="USING: compiler.errors memory namespaces parser.notes syntax vocabs.hierarchy ; parser-quiet? off auto-use? off load-all save compiler-errors get assoc-empty? 0 1 ? exit"'
    - name: test
      run: './factor -run=tools.test resource:core compiler threads io'
    - name: help-lint
      run: './factor -run=help.lint resource:core resource:basis resource:extra'

  build-linux-arm:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v4
    - name: bootstrap
      run: ./build.sh net-bootstrap
    - name: load-all
      run: './factor -e="USING: compiler.errors memory namespaces parser.notes syntax vocabs.hierarchy ; parser-quiet? off auto-use? off load-all save compiler-errors get assoc-empty? 0 1 ? exit"'
    - name: test
      run: './factor -run=tools.test resource:core compiler threads io'
    - name: arm64-regressions
      run: ./factor -no-user-init -no-monitors .github/arm64-tests.factor
    - name: arm64-regressions-portable
      run: ./factor -no-user-init -no-monitors -disable-neon-extensions .github/arm64-tests.factor
    - name: arm64-feature-cache-save
      run: ./factor -no-user-init -no-monitors .github/arm64-feature-cache-save.factor
    - name: arm64-feature-cache-restart
      run: ./factor -i=arm64-feature-cache.image -no-user-init -no-monitors .github/arm64-feature-cache-check.factor
    - name: help-lint
      run: './factor -run=help.lint resource:core resource:basis resource:extra'

  build-macos-intel:
    runs-on: macos-15-intel
    steps:
    - uses: actions/checkout@v4
    - name: build
      run: ./build.sh net-bootstrap
    - name: load-all
      run: './factor -e="USING: compiler.errors memory namespaces parser.notes syntax vocabs.hierarchy ; parser-quiet? off auto-use? off load-all save compiler-errors get assoc-empty? 0 1 ? exit"'
    - name: test
      run: './factor -run=tools.test resource:core'
    - name: help-lint
      run: './factor -run=help.lint resource:core resource:basis resource:extra'

  build-macos-arm:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    - name: build
      run: ./build.sh net-bootstrap
    - name: load-all
      run: './factor -e="USING: compiler.errors memory namespaces parser.notes syntax vocabs.hierarchy ; parser-quiet? off auto-use? off load-all save compiler-errors get assoc-empty? 0 1 ? exit"'
    - name: test
      run: './factor -run=tools.test resource:core'
    - name: arm64-regressions
      run: ./factor -no-user-init -no-monitors .github/arm64-tests.factor
    - name: arm64-regressions-portable
      run: ./factor -no-user-init -no-monitors -disable-neon-extensions .github/arm64-tests.factor
    - name: arm64-feature-cache-save
      run: ./factor -no-user-init -no-monitors .github/arm64-feature-cache-save.factor
    - name: arm64-feature-cache-restart
      run: ./factor -i=arm64-feature-cache.image -no-user-init -no-monitors .github/arm64-feature-cache-check.factor
    - name: help-lint
      run: './factor -run=help.lint resource:core resource:basis resource:extra'

  build-windows-intel:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
    - uses: ilammy/msvc-dev-cmd@v1
    - name: build
      shell: cmd
      run: build.cmd compile
    - name: build-report
      run: 'Foreach ($f in Get-ChildItem  *.exe,*.com,*.dll) { "{0} {1}" -f (Split-Path -Path $f -Leaf),$f.Length }'
    - name: vm-tests
      shell: cmd
      run: nmake /nologo /f Nmakefile test-vm LTO=1
    - name: boot-image
      shell: cmd
      run: build.cmd update-boot-image
    - name: bootstrap
      shell: cmd
      run: build.cmd bootstrap
    - name: load-all
      shell: cmd
      run: 'factor -e="USING: compiler.errors memory namespaces parser.notes syntax vocabs.hierarchy ; parser-quiet? off auto-use? off load-all save compiler-errors get assoc-empty? 0 1 ? exit"'
    - name: test
      shell: cmd
      run: 'factor.com -run=tools.test resource:core compiler threads io command-line http.server.requests windows.com images.loader vocabs.refresh.monitor ui.backend.windows'
    - name: stack-safety
      run: python vm/tests/stack_safety.py -v
    - name: allocation-failure
      run: python vm/tests/windows_allocation.py -v
    - name: help-lint
      shell: cmd
      run: 'factor -run=help.lint resource:core resource:basis resource:extra'

  build-windows-arm:
    runs-on: windows-11-arm
    steps:
    - uses: actions/checkout@v4
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: arm64
    - name: build
      shell: cmd
      run: build.cmd compile
    - name: build-report
      run: 'Foreach ($f in Get-ChildItem  *.exe,*.com,*.dll) { "{0} {1}" -f (Split-Path -Path $f -Leaf),$f.Length }'
    - name: vm-tests
      shell: cmd
      run: nmake /nologo /f Nmakefile test-vm LTO=1
    - name: boot-image
      shell: cmd
      run: build.cmd update-boot-image
    - name: bootstrap
      shell: cmd
      run: build.cmd bootstrap
    - name: load-all
      shell: cmd
      run: 'factor -e="USING: compiler.errors memory namespaces parser.notes syntax vocabs.hierarchy ; parser-quiet? off auto-use? off load-all save compiler-errors get assoc-empty? 0 1 ? exit"'
    - name: test
      shell: cmd
      run: 'factor.com -run=tools.test resource:core compiler threads io command-line http.server.requests windows.com images.loader vocabs.refresh.monitor ui.backend.windows'
    - name: stack-safety
      run: python vm/tests/stack_safety.py -v
    - name: allocation-failure
      run: python vm/tests/windows_allocation.py -v
    - name: arm64-regressions
      shell: cmd
      run: factor.com -no-user-init -no-monitors .github/arm64-tests.factor
    - name: arm64-regressions-portable
      shell: cmd
      run: factor.com -no-user-init -no-monitors -disable-neon-extensions .github/arm64-tests.factor
    - name: arm64-feature-cache-save
      shell: cmd
      run: factor.com -no-user-init -no-monitors .github/arm64-feature-cache-save.factor
    - name: arm64-feature-cache-restart
      shell: cmd
      run: factor.com -i=arm64-feature-cache.image -no-user-init -no-monitors .github/arm64-feature-cache-check.factor
    - name: help-lint
      shell: cmd
      run: 'factor -run=help.lint resource:core resource:basis resource:extra'
