name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build-linux-intel:
    runs-on: ubuntu-24.04
    env:
      FACTOR_GUI_TEST_IMAGE: ${{ github.workspace }}/factor-gui.image
    steps:
    - uses: actions/checkout@v4
    - name: runtime-library-probe
      run: python3 vm/tests/library_probe.py
    - name: gtk-runtime-libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libgtk-3-0t64 libgtk2.0-0t64
    - name: bootstrap
      run: |
        ./build.sh net-bootstrap
        ./factor -no-user-init -no-monitors -e='USING: bootstrap.image vocabs.loader ; "bootstrap.image" reload "unix-x86.64" make-image'
        ./factor -i=boot.unix-x86.64.image -no-user-init -no-monitors -output-image=factor.image
        cp factor.image factor-gui.image
    - name: load-all
      run: './factor -e="USING: compiler.errors memory namespaces parser.notes syntax vocabs.hierarchy ; parser-quiet? off auto-use? off load-all save compiler-errors get assoc-empty? 0 1 ? exit"'
    - name: test
      run: './factor -run=tools.test resource:core compiler threads io'
    - name: ffi-allocator-regressions
      run: ./factor -no-user-init -no-monitors .github/ffi-allocators.factor
    - name: compiler-verification
      run: ./factor -no-user-init -no-monitors .github/compiler-verify.factor
    - name: gtk3-dialogs
      env:
        G_DEBUG: fatal-criticals
      run: timeout 60s xvfb-run -a ./factor -no-user-init -no-monitors .github/gtk-tests.factor
    - name: gtk2-dialogs
      env:
        G_DEBUG: fatal-criticals
        FACTOR_GUI_TEST_IMAGE: ${{ github.workspace }}/gtk2.image
      run: |
        ./factor -no-user-init -no-monitors -e='USING: bootstrap.image vocabs.loader ; "bootstrap.image" reload "unix-x86.64" make-image'
        ./factor -i=boot.unix-x86.64.image -ui-backend=gtk2 -no-user-init -no-monitors -output-image=gtk2.image
        timeout 60s xvfb-run -a ./factor -i=gtk2.image -no-user-init -no-monitors .github/gtk-tests.factor
    - name: help-lint
      run: './factor -run=help.lint resource:core resource:basis resource:extra'

  build-linux-arm:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v4
    - name: runtime-library-probe
      run: python3 vm/tests/library_probe.py
    - name: qualification-toolchain
      run: |
        mkdir -p logs/arm64-qualification
        uname -a > logs/arm64-qualification/host.txt
        lscpu >> logs/arm64-qualification/host.txt
        git rev-parse HEAD > logs/arm64-qualification/source.txt
        sudo apt-get update
        sudo apt-get install -y clang-18 libclang-rt-18-dev
        dpkg-query -W gcc clang-18 libclang-rt-18-dev libc6 > logs/arm64-qualification/packages.txt
    - name: bootstrap
      env:
        CC: gcc
        CXX: g++
      run: |
        set -o pipefail
        ./build.sh net-bootstrap 2>&1 | tee logs/arm64-qualification/bootstrap.log
        ./factor -no-user-init -no-monitors .github/arm64-source-boot.factor 2>&1 | tee logs/arm64-qualification/source-boot.log
        ./factor -i=boot.unix-arm.64.image -no-user-init -no-monitors -output-image=factor.image 2>&1 | tee logs/arm64-qualification/source-bootstrap.log
    - name: load-all
      id: loaded
      run: './factor -e="USING: compiler.errors memory namespaces parser.notes syntax vocabs.hierarchy ; parser-quiet? off auto-use? off load-all save compiler-errors get assoc-empty? 0 1 ? exit"'
    - name: test
      run: './factor -run=tools.test resource:core compiler threads io'
    - name: native-varargs-gcc
      run: python3 .github/check-arm64-varargs.py --cc gcc
    - name: install-varargs-clang
      run: sudo apt-get update && sudo apt-get install -y clang-18
    - name: native-varargs-clang
      run: python3 .github/check-arm64-varargs.py --cc clang-18 --require-small
    - name: arm64-regressions
      run: ./factor -no-user-init -no-monitors .github/arm64-tests.factor
    - name: arm64-regressions-portable
      run: ./factor -no-user-init -no-monitors -disable-neon-extensions .github/arm64-tests.factor
    - name: arm64-feature-cache-save
      run: ./factor -no-user-init -no-monitors .github/arm64-feature-cache-save.factor
    - name: arm64-feature-cache-restart
      run: ./factor -i=arm64-feature-cache.image -no-user-init -no-monitors .github/arm64-feature-cache-check.factor
    - name: gcc-abi-qualification
      if: ${{ !cancelled() && steps.loaded.outcome == 'success' }}
      run: python3 .github/ffi-qualify.py --cc gcc --out logs/arm64-qualification/gcc --native-arm64 --full
    - name: clang-abi-qualification
      if: ${{ !cancelled() && steps.loaded.outcome == 'success' }}
      run: python3 .github/ffi-qualify.py --cc clang-18 --out logs/arm64-qualification/clang-18 --native-arm64 --require-small
    - name: qualification-evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: linux-arm64-abi-evidence
        path: logs/arm64-qualification/
        if-no-files-found: error
    - name: help-lint
      run: './factor -run=help.lint resource:core resource:basis resource:extra'

  build-macos-intel:
    runs-on: macos-15-intel
    steps:
    - uses: actions/checkout@v4
    - name: build
      run: ./build.sh net-bootstrap
    - name: load-all
      run: './factor -e="USING: compiler.errors memory namespaces parser.notes syntax vocabs.hierarchy ; parser-quiet? off auto-use? off load-all save compiler-errors get assoc-empty? 0 1 ? exit"'
    - name: test
      run: './factor -run=tools.test resource:core'
    - name: ffi-allocator-regressions
      run: ./factor -no-user-init -no-monitors .github/ffi-allocators.factor
    - name: compiler-verification
      run: ./factor -no-user-init -no-monitors .github/compiler-verify.factor
    - name: help-lint
      run: './factor -run=help.lint resource:core resource:basis resource:extra'

  build-macos-arm:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    - name: build
      run: ./build.sh net-bootstrap
    - name: load-all
      run: './factor -e="USING: compiler.errors memory namespaces parser.notes syntax vocabs.hierarchy ; parser-quiet? off auto-use? off load-all save compiler-errors get assoc-empty? 0 1 ? exit"'
    - name: test
      run: './factor -run=tools.test resource:core'
    - name: native-varargs-apple-clang
      run: python3 .github/check-arm64-varargs.py --cc /usr/bin/clang
    - name: install-varargs-clang
      run: brew install llvm
    - name: native-varargs-clang
      run: python3 .github/check-arm64-varargs.py --cc "$(brew --prefix llvm)/bin/clang" --require-small
    - name: arm64-regressions
      run: ./factor -no-user-init -no-monitors .github/arm64-tests.factor
    - name: arm64-regressions-portable
      run: ./factor -no-user-init -no-monitors -disable-neon-extensions .github/arm64-tests.factor
    - name: arm64-feature-cache-save
      run: ./factor -no-user-init -no-monitors .github/arm64-feature-cache-save.factor
    - name: arm64-feature-cache-restart
      run: ./factor -i=arm64-feature-cache.image -no-user-init -no-monitors .github/arm64-feature-cache-check.factor
    - name: ffi-allocator-regressions
      run: ./factor -no-user-init -no-monitors .github/ffi-allocators.factor
    - name: compiler-verification
      run: ./factor -no-user-init -no-monitors .github/compiler-verify.factor
    - name: help-lint
      run: './factor -run=help.lint resource:core resource:basis resource:extra'

  build-windows-intel:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
    - uses: ilammy/msvc-dev-cmd@v1
    - name: build
      shell: cmd
      run: build.cmd compile
    - name: build-report
      run: 'Foreach ($f in Get-ChildItem  *.exe,*.com,*.dll) { "{0} {1}" -f (Split-Path -Path $f -Leaf),$f.Length }'
    - name: vm-tests
      shell: cmd
      run: nmake /nologo /f Nmakefile test-vm LTO=1
    - name: boot-image
      shell: cmd
      run: build.cmd update-boot-image
    - name: bootstrap
      shell: cmd
      run: build.cmd bootstrap
    - name: load-all
      shell: cmd
      run: 'factor -e="USING: compiler.errors memory namespaces parser.notes syntax vocabs.hierarchy ; parser-quiet? off auto-use? off load-all save compiler-errors get assoc-empty? 0 1 ? exit"'
    - name: test
      shell: cmd
      run: 'factor.com -run=tools.test resource:core compiler threads io command-line http.server.requests windows.com images.loader vocabs.refresh.monitor ui.backend.windows'
    - name: stack-safety
      run: python vm/tests/stack_safety.py -v
    - name: allocation-failure
      run: python vm/tests/windows_allocation.py -v
    - name: help-lint
      shell: cmd
      run: 'factor -run=help.lint resource:core resource:basis resource:extra'

  build-windows-arm:
    runs-on: windows-11-arm
    steps:
    - uses: actions/checkout@v4
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: arm64
    - name: build
      shell: cmd
      run: build.cmd compile
    - name: build-report
      run: 'Foreach ($f in Get-ChildItem  *.exe,*.com,*.dll) { "{0} {1}" -f (Split-Path -Path $f -Leaf),$f.Length }'
    - name: vm-tests
      shell: cmd
      run: nmake /nologo /f Nmakefile test-vm LTO=1
    - name: boot-image
      shell: cmd
      run: build.cmd update-boot-image
    - name: bootstrap
      shell: cmd
      run: build.cmd bootstrap
    - name: load-all
      shell: cmd
      run: 'factor -e="USING: compiler.errors memory namespaces parser.notes syntax vocabs.hierarchy ; parser-quiet? off auto-use? off load-all save compiler-errors get assoc-empty? 0 1 ? exit"'
    - name: test
      shell: cmd
      run: 'factor.com -run=tools.test resource:core compiler threads io command-line http.server.requests windows.com images.loader vocabs.refresh.monitor ui.backend.windows'
    - name: stack-safety
      run: python vm/tests/stack_safety.py -v
    - name: allocation-failure
      run: python vm/tests/windows_allocation.py -v
    - name: native-varargs-msvc
      run: python .github/check-arm64-varargs.py --cc cl
    - name: install-varargs-clang
      run: choco upgrade llvm --yes --no-progress
    - name: native-varargs-clang
      run: python .github/check-arm64-varargs.py --cc 'C:\Program Files\LLVM\bin\clang-cl.exe' --require-small
    - name: arm64-regressions
      shell: cmd
      run: factor.com -no-user-init -no-monitors .github/arm64-tests.factor
    - name: arm64-regressions-portable
      shell: cmd
      run: factor.com -no-user-init -no-monitors -disable-neon-extensions .github/arm64-tests.factor
    - name: arm64-feature-cache-save
      shell: cmd
      run: factor.com -no-user-init -no-monitors .github/arm64-feature-cache-save.factor
    - name: arm64-feature-cache-restart
      shell: cmd
      run: factor.com -i=arm64-feature-cache.image -no-user-init -no-monitors .github/arm64-feature-cache-check.factor
    - name: help-lint
      shell: cmd
      run: 'factor -run=help.lint resource:core resource:basis resource:extra'
