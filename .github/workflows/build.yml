name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build-linux-intel:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        backend: [default, gtk4, gtk3]
    steps:
    - uses: actions/checkout@v4
    - name: dependencies
      run: |
        sudo apt-get update
        ./build.sh deps-apt -ui-backend=${{ matrix.backend == 'default' && 'gtk4' || matrix.backend }}
        sudo apt-get install --yes xvfb libgl1-mesa-dri
    - name: bootstrap
      run: |
        if [ "${{ matrix.backend }}" = default ]; then
          ./build.sh net-bootstrap
        else
          ./build.sh net-bootstrap -ui-backend=${{ matrix.backend }}
        fi
    - name: GTK4 smoke test
      if: matrix.backend != 'gtk3'
      run: xvfb-run -a env GDK_BACKEND=x11 ./factor -no-user-init -run=ui.backend.gtk4.smoke-test
    - name: GTK4 tests
      if: matrix.backend != 'gtk3'
      run: ./factor -run=tools.test ui.backend.gtk4 opengl.gl.epoxy opengl.gl.extensions

    - name: load-all
      run: './factor -e="USING: compiler.errors memory namespaces parser.notes syntax vocabs.hierarchy ; parser-quiet? off auto-use? off load-all save compiler-errors get assoc-empty? 0 1 ? exit"'
    - name: test
      run: './factor -run=tools.test resource:core compiler threads io'
    - name: help-lint
      run: './factor -run=help.lint resource:core resource:basis resource:extra'

  build-linux-arm:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v4
    - name: dependencies
      run: |
        sudo apt-get update
        ./build.sh deps-apt
    - name: bootstrap
      run: ./build.sh net-bootstrap
    - name: load-all
      run: './factor -e="USING: compiler.errors memory namespaces parser.notes syntax vocabs.hierarchy ; parser-quiet? off auto-use? off load-all save compiler-errors get assoc-empty? 0 1 ? exit"'
    - name: test
      run: './factor -run=tools.test resource:core compiler threads io'
    - name: help-lint
      run: './factor -run=help.lint resource:core resource:basis resource:extra'

  build-macos-intel:
    runs-on: macos-15-intel
    steps:
    - uses: actions/checkout@v4
    - name: build
      run: ./build.sh net-bootstrap
    - name: load-all
      run: './factor -e="USING: compiler.errors memory namespaces parser.notes syntax vocabs.hierarchy ; parser-quiet? off auto-use? off load-all save compiler-errors get assoc-empty? 0 1 ? exit"'
    - name: test
      run: './factor -run=tools.test resource:core'
    - name: help-lint
      run: './factor -run=help.lint resource:core resource:basis resource:extra'

  build-macos-arm:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    - name: build
      run: ./build.sh net-bootstrap
    - name: load-all
      run: './factor -e="USING: compiler.errors memory namespaces parser.notes syntax vocabs.hierarchy ; parser-quiet? off auto-use? off load-all save compiler-errors get assoc-empty? 0 1 ? exit"'
    - name: test
      run: './factor -run=tools.test resource:core'
    - name: help-lint
      run: './factor -run=help.lint resource:core resource:basis resource:extra'

  build-windows-intel:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
    - uses: ilammy/msvc-dev-cmd@v1
    - name: build
      shell: cmd
      run: build.cmd compile
    - name: build-report
      run: 'Foreach ($f in Get-ChildItem  *.exe,*.com,*.dll) { "{0} {1}" -f (Split-Path -Path $f -Leaf),$f.Length }'
    - name: bootstrap
      run: |
           .\build.cmd update-boot-image
           .\build.cmd bootstrap
    - name: load-all
      shell: cmd
      run: 'factor -e="USING: compiler.errors memory namespaces parser.notes syntax vocabs.hierarchy ; parser-quiet? off auto-use? off load-all save compiler-errors get assoc-empty? 0 1 ? exit"'
    - name: test
      shell: cmd
      run: 'factor -run=tools.test resource:core'
    - name: help-lint
      shell: cmd
      run: 'factor -run=help.lint resource:core resource:basis resource:extra'

  build-windows-arm:
    runs-on: windows-11-arm
    steps:
    - uses: actions/checkout@v4
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: arm64
    - name: build
      shell: cmd
      run: build.cmd compile
    - name: build-report
      run: 'Foreach ($f in Get-ChildItem  *.exe,*.com,*.dll) { "{0} {1}" -f (Split-Path -Path $f -Leaf),$f.Length }'
    - name: bootstrap
      run: |
           .\build.cmd update-boot-image
           .\build.cmd bootstrap
    - name: load-all
      shell: cmd
      run: 'factor -e="USING: compiler.errors memory namespaces parser.notes syntax vocabs.hierarchy ; parser-quiet? off auto-use? off load-all save compiler-errors get assoc-empty? 0 1 ? exit"'
    - name: test
      shell: cmd
      run: 'factor -run=tools.test resource:core'
    - name: help-lint
      shell: cmd
      run: 'factor -run=help.lint resource:core resource:basis resource:extra'
